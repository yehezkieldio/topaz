services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: topaz
      POSTGRES_PASSWORD: topaz
      POSTGRES_DB: topaz
    ports:
      - "5432:5432"
    volumes:
      - topaz_postgres_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topaz -d topaz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  topaz_postgres_data:
